OK 👍 vậy mình sẽ bỏ hoàn toàn upload-artifact và sửa lại step Telegram để:

👉 lấy đúng tên file thật (chuẩn 100%)
👉 gửi đúng từng APK với tên gốc (không bị sai / thiếu arm64)

✅ Bản Telegram upload chuẩn (final)
- name: Send APKs to Telegram
  if: success()
  env:
    BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    CHAT_ID: ${{ secrets.TELEGRAM_USER_ID }}
  run: |
    echo "🔍 Tìm APK..."

    mapfile -t APK_FILES < <(find ./app/build/outputs/apk/release -type f -name "*.apk")

    if [ ${#APK_FILES[@]} -eq 0 ]; then
      echo "❌ Không tìm thấy APK"
      exit 1
    fi

    echo "📦 Danh sách APK:"
    printf '%s\n' "${APK_FILES[@]}"

    for FILE_PATH in "${APK_FILES[@]}"; do
      echo "------------------------------------------"

      # Resolve path thật
      REAL_PATH=$(realpath "$FILE_PATH")

      # Lấy tên file CHUẨN từ file thật
      FILENAME=$(basename "$REAL_PATH")

      echo "📤 Đang gửi: $FILENAME"

      # Đảm bảo quyền đọc
      chmod +r "$REAL_PATH"

      RESPONSE=$(curl -s -L --retry 3 -w "\n%{http_code}" \
        -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" \
        -F chat_id="$CHAT_ID" \
        -F "document=@$REAL_PATH;filename=$FILENAME" \
        -F parse_mode=HTML \
        -F "caption=<b>APK:</b> <code>$FILENAME</code>%0A<b>Repo:</b> ${{ github.repository }}")

      HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
      BODY=$(echo "$RESPONSE" | head -n -1)

      if [ "$HTTP_STATUS" -eq 200 ]; then
        echo "✅ Thành công: $FILENAME"
      else
        echo "❌ Lỗi: $FILENAME"
        echo "HTTP: $HTTP_STATUS"
        echo "Response: $BODY"
      fi
    done
