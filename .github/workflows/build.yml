Gửi lại toàn bộ

Dưới đây là bản hoàn chỉnh đã fix lỗi exit code 26, thêm check file + quyền + xử lý path an toàn + debug rõ ràng:

- name: Send All APKs Separately to Telegram
  if: success()
  env:
    BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    CHAT_ID: ${{ secrets.TELEGRAM_USER_ID }}
  run: |
    echo "🔍 Tìm file APK..."
    mapfile -t APK_FILES < <(find ./app/build/outputs/apk/release -name "*.apk" -type f)

    # Check nếu không có file
    if [ ${#APK_FILES[@]} -eq 0 ]; then
      echo "❌ Không tìm thấy file APK nào!"
      exit 1
    fi

    for FILE_PATH in "${APK_FILES[@]}"; do
      echo "------------------------------------------"

      # 1. Kiểm tra file tồn tại
      if [ ! -f "$FILE_PATH" ]; then
        echo "❌ File không tồn tại: $FILE_PATH"
        continue
      fi

      # 2. Resolve path thật (tránh lỗi symlink)
      REAL_PATH=$(realpath "$FILE_PATH")

      # 3. Lấy thông tin file
      FILENAME=$(basename "$REAL_PATH")
      FILE_SIZE=$(stat -c%s "$REAL_PATH")
      MAX_SIZE=52428800 # 50MB

      echo "📦 File: $FILENAME ($((FILE_SIZE / 1048576)) MB)"
      echo "📂 Path: $REAL_PATH"

      # 4. Debug thêm
      ls -lh "$REAL_PATH"
      file "$REAL_PATH"

      # 5. Check dung lượng
      if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
        echo "⚠️ File quá lớn (>50MB). Bỏ qua."
        continue
      fi

      # 6. Đảm bảo quyền đọc
      chmod +r "$REAL_PATH"

      # 7. Gửi file
      RESPONSE=$(curl -s -L --retry 3 -w "\n%{http_code}" \
        -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" \
        -F chat_id="$CHAT_ID" \
        -F document=@"$REAL_PATH" \
        -F parse_mode=HTML \
        -F caption="<b>Artifact:</b> <code>$FILENAME</code>%0A<b>Repo:</b> ${{ github.repository }}")

      HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
      BODY=$(echo "$RESPONSE" | head -n -1)

      # 8. Kiểm tra kết quả
      if [ "$HTTP_STATUS" -eq 200 ]; then
        echo "✅ Gửi thành công!"
      else
        echo "❌ Thất bại! HTTP: $HTTP_STATUS"
        echo "📩 Response: $BODY"
      fi
    done
