name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7 ]

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        
# ✅ THÊM: Decode keystore
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > app/keystore.jks

      - name: Build APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          echo "Setting vars"

          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
              GITHUB_SHA="${{ github.event.pull_request.head.sha }}"
          fi

          # ✅ THÊM: export biến keystore
          export KEYSTORE_PATH=keystore.jks
          export KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          export KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          export KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}

          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          RELEASE_VERSION_NAME="v$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}"

          if ! printf "%s" "${RELEASE_VERSION_NAME/v/}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
           exit_on_error "Invalid versionName"
          fi

          APK_DIR_PATH="./app/build/outputs/apk/release"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-${{ env.PACKAGE_VARIANT }}-github-release"
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"

          echo "APK_DIR_PATH=$APK_DIR_PATH" >> $GITHUB_ENV
          echo "APK_VERSION_TAG=$APK_VERSION_TAG" >> $GITHUB_ENV
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> $GITHUB_ENV

          echo "Building APKs"
          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}"
          export splitAPKsForReleaseBuilds=1

          # ✅ ĐỔI: build release để dùng keystore
          if ! ./gradlew assembleRelease; then
            exit_on_error "Build failed"
          fi

          echo "Validating APKs"
          for abi in arm64-v8a; do
            if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              files_found="$(ls "$APK_DIR_PATH")"
              exit_on_error "Missing APK: $abi"$'\n'"$files_found"
            fi
          done

          echo "Generating sha256sums file"
          if ! (cd "$APK_DIR_PATH"; sha256sum \
            "${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
            > "${APK_BASENAME_PREFIX}_sha256sums"); then
            exit_on_error "sha256 failed"
          fi

      - name: Attach arm64-v8a APK file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_arm64-v8a
          path: |
            ${{ env.APK_DIR_PATH }}/*arm64-v8a.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json
            
      - name: Debug workspace and find APK
        run: |
         echo "📂 Thư mục hiện tại:"
         pwd

         echo "📁 Liệt kê toàn bộ file:"
         ls

         echo "🔍 Tìm file APK:"
         find . -type f -name "*.apk"
         #exit 1

         #echo "🔍 Tìm APK trong thư mục build (nếu có):"
         #find ./app/build/outputs/apk -type f -name "*.apk" 2>/dev/null || echo "Không có thư mục build"

      - name: Send Notification to Telegram
        if: success()
        uses: xireiki/channel-post@v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_USER_ID }}
          # Ensure 'context' ends before the next key starts
          context: |
            <b>Repository:</b> <a href="https://github.com/${{ github.repository }}">${{ github.repository }}</a>
          parse_mode: HTML
          method: sendMessage
          
      - name: Send APK via Node.js
      shell: node {0}
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        FILE_PATH: ${{ env.FULL_PATH }} # Đảm bảo bạn đã set FULL_PATH ở bước trước
        FILE_NAME: ${{ env.NAME }}
      run: |
        const fs = require('fs');
        const https = require('https');
        const FormData = require('form-data'); // Có sẵn trên runner

        const form = new FormData();
        form.append('chat_id', process.env.CHAT_ID);
        form.append('document', fs.createReadStream(process.env.FILE_PATH), { filename: process.env.FILE_NAME });
        form.append('parse_mode', 'HTML');
        form.append('caption', `<b>APK:</b> <code>${process.env.FILE_NAME}</code>\n<b>Repo:</b> BEACHEADVN/Nidalee`);

        const options = {
          method: 'POST',
          hostname: 'api.telegram.org',
          path: `/bot${process.env.BOT_TOKEN}/sendDocument`,
          headers: form.getHeaders(),
        };

        const req = https.request(options, (res) => {
          console.log(`HTTP Status: ${res.statusCode}`);
          res.on('data', (d) => process.stdout.write(d));
          if (res.statusCode !== 200) process.exit(1);
        });

        req.on('error', (e) => {
          console.error(e);
          process.exit(1);
        });

        form.pipe(req);
