Exit code 26 từ curl thường là: "Failed to open/read local data from file" → tức là curl không đọc được file APK chứ không phải lỗi Telegram.

Nhìn script của bạn thì có vài nguyên nhân rất hay gặp:

🔥 Nguyên nhân phổ biến
1. Đường dẫn file có vấn đề
find trả về path đúng, nhưng khi curl -F "document=@$FILE_PATH":

Nếu path có ký tự lạ / khoảng trắng → lỗi

Hoặc file không còn tồn tại tại thời điểm gửi

👉 Debug thêm:

ls -lh "$FILE_PATH"
2. Quyền đọc file (permission)
GitHub Actions đôi khi build xong nhưng file không readable

👉 Fix:

chmod +r "$FILE_PATH"
3. Curl không đọc được file do ký tự đặc biệt
Cách bạn truyền:

-F "document=@$FILE_PATH"
có thể fail nếu path chứa ký tự đặc biệt

👉 Fix chuẩn hơn:

-F document=@"$FILE_PATH"
4. File bị xóa / không tồn tại
Trước khi gửi nên check chắc chắn:

if [ ! -f "$FILE_PATH" ]; then
  echo "❌ File không tồn tại: $FILE_PATH"
  continue
fi
✅ Bản fix hoàn chỉnh (khuyên dùng)
Sửa đoạn gửi file thành:

# Đảm bảo file tồn tại
if [ ! -f "$FILE_PATH" ]; then
  echo "❌ File không tồn tại: $FILE_PATH"
  continue
fi

# Cấp quyền đọc
chmod +r "$FILE_PATH"

RESPONSE=$(curl -s -L --retry 3 -w "\n%{http_code}" \
  -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" \
  -F chat_id="$CHAT_ID" \
  -F document=@"$FILE_PATH" \
  -F parse_mode=HTML \
  -F caption="<b>Artifact:</b> <code>$FILENAME</code>%0A<b>Repo:</b> ${{ github.repository }}")
