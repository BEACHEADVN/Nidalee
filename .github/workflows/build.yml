name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7 ]

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > app/keystore.jks

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          exit_on_error() { echo "❌ $1"; exit 1; }

          # Export variables for Gradle
          export KEYSTORE_PATH=keystore.jks
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}"
          export splitAPKsForReleaseBuilds=1

          echo "Building Release APK..."
          chmod +x gradlew
          if ! ./gradlew assembleRelease; then
            exit_on_error "Build failed"
          fi

      - name: Rename APK and Get Info
        id: rename
        run: |
          # Tìm file APK arm64-v8a (hoặc file đầu tiên nếu không thấy)
          APK_FILE=$(find ./app/build/outputs/apk/release -name "*arm64-v8a.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find ./app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK found!"
            exit 1
          fi

          # Xử lý tên file (xóa đuôi github-release nếu có)
          NEW_NAME=$(basename "$APK_FILE" | sed 's/-github-release//')
          NEW_PATH="./app/build/outputs/apk/release/$NEW_NAME"
          mv "$APK_FILE" "$NEW_PATH"
          
          # Tạo SHA256
          cd ./app/build/outputs/apk/release
          sha256sum "$NEW_NAME" > "${NEW_NAME}.sha256"
          cd -

          # Đẩy Output
          echo "apk_path=$NEW_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          
          # Xử lý Commit Message an toàn cho HTML
          SAFE_MSG=$(git log -1 --pretty=format:'%s' | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          echo "msg=$SAFE_MSG" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.apk_name }}
          path: |
            ${{ steps.rename.outputs.apk_path }}
            ${{ steps.rename.outputs.apk_path }}.sha256
          retention-days: 7

      - name: Send Notification to Telegram
        uses: xireiki/channel-post@v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_USER_ID }}
          path: ${{ steps.rename.outputs.apk_path }}
          method: sendDocument
          api_server_file_name: ${{ steps.rename.outputs.apk_name }}
          parse_mode: HTML
          context: |
            <b>📦 Build Successful</b>
            
            <b>Repository:</b> <a href="https://github.com/${{ github.repository }}">${{ github.repository }}</a>
            <b>Branch:</b> <code>${{ github.ref_name }}</code>
            <b>Commit:</b> <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">${{ steps.rename.outputs.short_sha }}</a>
            
            <b>Message:</b>
            <code>${{ steps.rename.outputs.msg }}</code>
            
            <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">🛠️ View Workflow Run</a>
